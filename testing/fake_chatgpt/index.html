<!doctype html>
<!-- A stand-in for chatgpt.com's chat page (markup as of Nov 2026) with the hooks desktop_chatgpt.py uses. -->
<meta charset="utf-8"><title>ChatGPT</title>
<main id="thread"></main>
<form>
  <div id="prompt-textarea" class="ProseMirror" contenteditable="true"></div>
  <button id="composer-submit-button" data-testid="send-button" aria-label="Send prompt" type="button" disabled>Send</button>
</form>
<script>
const box = document.getElementById('prompt-textarea');
const send = document.getElementById('composer-submit-button');
const thread = document.getElementById('thread');
const sync = () => { send.disabled = !box.innerText.trim(); };
// ProseMirror reads pasted text from the clipboard event and turns lines into paragraphs.
box.addEventListener('paste', (e) => {
  e.preventDefault();
  box.innerHTML = '';
  for (const line of e.clipboardData.getData('text/plain').split('\n')) {
    const p = document.createElement('p'); p.textContent = line; box.appendChild(p);
  }
  sync();
});
box.addEventListener('input', sync);
send.addEventListener('click', () => {
  const asked = box.innerText;
  const user = document.createElement('div');
  user.dataset.userMessageBubble = 'true'; user.innerText = asked; thread.appendChild(user);
  box.innerHTML = ''; sync();
  history.pushState({}, '', '/c/12345678-1234-1234-1234-123456789abc');
  // The send button stays a send button now; the turn's state says whether it is still streaming.
  const turn = document.createElement('div');
  turn.dataset.talvtTurnState = 'streaming';
  turn.innerHTML = '<div data-response-body="m1"><div data-markdown-text-style="assistant-message"><p></p></div></div>';
  thread.appendChild(turn);
  const reply = turn.querySelector('[data-response-body]');
  const text = reply.querySelector('p');
  const words = ('17 times 23 is 391. (You asked: ' + asked.split('\n').find((l) => l.includes('?')) + ')').split(' ');
  let i = 0;
  const tick = setInterval(() => {
    text.innerText += (i ? ' ' : '') + words[i++];
    if (i >= words.length) {
      clearInterval(tick);
      setTimeout(() => { turn.dataset.talvtTurnState = 'complete'; }, 2500);   // finishes well after the last word
    }
  }, 120);
});
</script>
